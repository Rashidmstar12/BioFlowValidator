[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioflowvalidator"
version = "1.0.0"
description = "A rule-based validation engine for RNA-seq count matrices and sample metadata"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Rashid Mstar", email = "rashidmstar12@gmail.com" }
]
keywords = [
  "RNA-seq", "bioinformatics", "validation", "differential expression",
  "quality control", "genomics", "transcriptomics"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.29.0",
  "python-multipart==0.0.22",
  "pandas>=2.1.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "jinja2>=3.1.0",
  "openpyxl>=3.1.0",
  "httpx>=0.27.0",
  "chardet>=5.2.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[project.scripts]
bioflowvalidator = "app.main:start"

[project.urls]
Homepage = "https://github.com/Rashidmstar12/BioFlowValidator"
Repository = "https://github.com/Rashidmstar12/BioFlowValidator"
"Bug Tracker" = "https://github.com/Rashidmstar12/BioFlowValidator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
