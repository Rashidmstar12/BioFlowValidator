# BioFlowValidator Benchmark Manifest
#
# This file records every dataset used in the benchmark, its source type
# (proxy vs true_public_data), checksums, and preparation steps.
#
# benchmark_mode:
#   proxy           — structurally faithful NB-simulated count matrix.
#                     Used for CI/CD benchmarking where GEO FTP is unavailable.
#   true_public_data — actual raw GEO download, verified integer counts,
#                     real biological signal.  Must be generated outside CI.
#
# To switch a dataset from proxy to true_public_data:
#   1. Download the real data: python datasets/fetch_real_data.py --dataset <NAME>
#      (or follow the manual steps in datasets/real/<NAME>/README.md)
#   2. Re-run checksums: python datasets/ingest_real_data.py --dataset <NAME>
#   3. Update source_type to "true_public_data" below.
#   4. Run: PYTHONPATH=backend python datasets/benchmark_eval.py --strict
#   5. Copy benchmark_results.json into datasets/external_benchmark_<NAME>.md

schema_version: "1.0"
generated: "2026-04-13"
generator: datasets/benchmark_manifest.yaml

